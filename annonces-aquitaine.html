<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Collectionneurs d’Aquitaine – objets de collection entre particuliers</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f1;--surface:#fff;--ink:#16302b;--muted:#5d716c;--line:#d3dedb;--accent:#8e2a3b;--accent-ink:#fff;--pine:#1f4a40;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1f1c;--surface:#172b27;--ink:#e6efec;--muted:#9bb0aa;--line:#2b443e;--accent:#e0708a;--accent-ink:#1a0a0e;--pine:#7fc4b2}}
:root[data-theme="dark"]{--bg:#0f1f1c;--surface:#172b27;--ink:#e6efec;--muted:#9bb0aa;--line:#2b443e;--accent:#e0708a;--accent-ink:#1a0a0e;--pine:#7fc4b2}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Public Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;line-height:1.15}
header{background:var(--pine);color:#fff;padding:20px 16px 18px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header{color:#0f1f1c}}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
header .wrap{padding:0;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{font-size:1.6rem;font-weight:800}
header p{margin:2px 0 0;opacity:.85;font-size:.9rem}
button,select,input,textarea{font:inherit;color:inherit}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.filters input,.filters select,.form input,.form select,.form textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.filters .search{grid-column:1/-1}
.sponsor{display:block;margin:0 0 16px;padding:12px 14px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:.85rem;text-decoration:none;text-align:center}
.sponsor b{color:var(--ink)}
.count{color:var(--muted);font-size:.9rem;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding-bottom:40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column}
.card .ph{aspect-ratio:4/3;background:var(--line) center/cover;display:grid;place-items:center;font-size:2.2rem}
.card .b{padding:10px 12px 12px}
.card h3{font-size:1rem;font-weight:600}
.price{font-weight:800;color:var(--accent);margin-top:4px}
.meta{color:var(--muted);font-size:.82rem;margin-top:2px}
.tag{display:inline-block;background:var(--accent);color:var(--accent-ink);font-size:.72rem;padding:1px 8px;border-radius:99px;margin-bottom:4px}
dialog{border:0;border-radius:16px;padding:0;width:min(520px,94vw);max-height:92vh;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dl{padding:18px;display:grid;gap:10px}
.dl .ph{aspect-ratio:4/3;background:var(--line) center/cover;border-radius:10px;display:grid;place-items:center;font-size:3rem}
.form label{display:grid;gap:4px;font-size:.88rem;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.note{font-size:.82rem;color:var(--muted)}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
.tel{font-size:1.3rem;font-weight:800;color:var(--pine)}
footer{padding:20px 16px 40px;color:var(--muted);font-size:.8rem;text-align:center}
</style>
</head>
<body>
<header><div class="wrap">
  <div><h1>Collectionneurs d’Aquitaine</h1><p>Objets de collection, entre particuliers, en main propre.</p></div>
  <button class="btn" id="newBtn" style="background:#fff;color:#1f4a40">Déposer une annonce</button>
</div></header>

<main class="wrap">
  <div class="filters">
    <input class="search" id="q" type="search" placeholder="Pièce, disque, figurine, carte…" aria-label="Recherche">
    <select id="cat" aria-label="Catégorie"></select>
    <select id="dep" aria-label="Département"></select>
    <input id="max" type="number" min="0" placeholder="Prix max (€)" aria-label="Prix maximum">
    <select id="sort" aria-label="Tri"><option value="new">Plus récentes</option><option value="asc">Prix croissant</option><option value="desc">Prix décroissant</option></select>
  </div>
  <a class="sponsor" href="#sponsor" id="sponsor">Espace sponsor local : <b>votre brocante, salon ou boutique de collection ici</b></a>
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
</main>
<footer>Prototype : les annonces sont enregistrées uniquement dans votre navigateur.</footer>

<dialog id="detail"><div class="dl" id="detailBody"></div></dialog>

<dialog id="post"><form class="dl form" id="form" method="dialog">
  <h2>Déposer une annonce</h2>
  <label>Titre<input name="title" required maxlength="70"></label>
  <div class="row"><label style="flex:1">Prix (€)<input name="price" type="number" min="0" required></label>
  <label style="flex:1">Catégorie<select name="cat" id="fcat"></select></label></div>
  <div class="row"><label style="flex:1">Département<select name="dep" id="fdep"></select></label>
  <label style="flex:1">Ville<input name="city" required maxlength="40"></label></div>
  <label>Description<textarea name="desc" rows="3" maxlength="600" required></textarea></label>
  <label>État de l’objet<select name="etat">${ETATS_PLACEHOLDER}</select></label>
  <label>Téléphone<input name="tel" type="tel" required pattern="[0-9 +.]{10,16}"></label>
  <label>Photo (facultatif)<input name="photo" type="file" accept="image/*" id="photo"></label>
  <label class="row" style="align-items:center;flex-wrap:nowrap"><input type="checkbox" name="part" required style="width:auto"> Je certifie être un particulier et non un professionnel.</label>
  <div class="row"><button class="btn" type="submit">Publier</button><button class="btn alt" type="button" id="cancel">Annuler</button></div>
</form></dialog>

<script>
const CATS={"🪙":"Monnaies & médailles","📮":"Timbres & cartes postales","🃏":"Cartes à collectionner","🧸":"Jouets & figurines","💿":"Vinyles & disques","📚":"Livres & BD anciennes","🕰️":"Montres & horlogerie","🏺":"Antiquités & brocante"};
const ETATS=["Neuf / scellé","Très bon état","Bon état","À restaurer"];
const DEPS={16:"Charente",17:"Charente-Maritime",19:"Corrèze",23:"Creuse",24:"Dordogne",33:"Gironde",40:"Landes",47:"Lot-et-Garonne",64:"Pyrénées-Atlantiques",79:"Deux-Sèvres",86:"Vienne",87:"Haute-Vienne"};
const KEY="collection-aquitaine-v2";
const now=Date.now(),day=864e5;
const seed=[
 {id:1,title:"Lot de 12 pièces de 5 francs Semeuse en argent",price:85,cat:"🪙",etat:"Très bon état",dep:33,city:"Bordeaux",desc:"Années variées, patine d’origine. Photos détaillées sur demande.",tel:"06 12 34 56 78",ts:now-day},
 {id:2,title:"Vinyle Pink Floyd – The Wall, pressage 1979",price:70,cat:"💿",etat:"Bon état",dep:64,city:"Pau",desc:"Double album, pochette ouverte, disques propres.",tel:"06 23 45 67 89",ts:now-2*day},
 {id:3,title:"Figurines Star Wars Kenner années 80, lot de 8",price:140,cat:"🧸",etat:"Bon état",dep:17,city:"La Rochelle",desc:"Figurines d’époque avec quelques accessoires. Sans boîtes.",tel:"06 34 56 78 90",ts:now-3*day},
 {id:4,title:"300 cartes postales anciennes du Périgord",price:60,cat:"📮",etat:"Bon état",dep:24,city:"Périgueux",desc:"Collection familiale, début XXe siècle, classées par village.",tel:"06 45 67 89 01",ts:now-4*day},
 {id:5,title:"Montre Lip mécanique des années 60",price:190,cat:"🕰️",etat:"À restaurer",dep:87,city:"Limoges",desc:"Fonctionne par intermittence, boîtier d’origine. Révision conseillée.",tel:"06 56 78 90 12",ts:now-5*day}
];
let ads;
try{ads=JSON.parse(localStorage.getItem(KEY))}catch(e){ads=null}
if(!Array.isArray(ads))ads=seed;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ads))}catch(e){alert("Stockage plein : supprimez une annonce ou utilisez une photo plus petite.")}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=n=>Number(n).toLocaleString("fr-FR")+" €";
const catOpts=(all)=>(all?'<option value="">Toutes les catégories</option>':'')+Object.entries(CATS).map(([k,v])=>`<option value="${k}">${k} ${v}</option>`).join("");
const depOpts=(all)=>(all?'<option value="">Toute la Nouvelle-Aquitaine</option>':'')+Object.entries(DEPS).map(([k,v])=>`<option value="${k}">${k} – ${v}</option>`).join("");
$("cat").innerHTML=catOpts(true);$("dep").innerHTML=depOpts(true);$("fcat").innerHTML=catOpts(false);document.querySelector('select[name="etat"]').innerHTML=ETATS.map(e=>`<option>${e}</option>`).join("");$("fdep").innerHTML=depOpts(false);

function ago(ts){const d=Math.floor((Date.now()-ts)/day);return d<1?"Aujourd’hui":d===1?"Hier":"Il y a "+d+" jours"}
function render(){
  const q=$("q").value.toLowerCase().trim(),c=$("cat").value,d=$("dep").value,m=parseFloat($("max").value),s=$("sort").value;
  let list=ads.filter(a=>(!q||(a.title+" "+a.desc+" "+a.city).toLowerCase().includes(q))&&(!c||a.cat===c)&&(!d||String(a.dep)===d)&&(isNaN(m)||a.price<=m));
  list.sort((a,b)=>s==="asc"?a.price-b.price:s==="desc"?b.price-a.price:b.ts-a.ts);
  $("count").textContent=list.length+(list.length>1?" annonces":" annonce");
  $("grid").innerHTML=list.length?list.map(a=>`<button class="card" data-id="${a.id}">
    <div class="ph" style="${a.photo?`background-image:url('${a.photo}')`:''}">${a.photo?"":a.cat}</div>
    <div class="b">${a.boost?'<span class="tag">À la une</span>':''}<h3>${esc(a.title)}</h3><div class="price">${eur(a.price)}</div>
    <div class="meta">${esc(a.city)} (${a.dep}) · ${ago(a.ts)}</div></div></button>`).join(""):'<div class="empty">Aucune annonce ne correspond. Essayez d’élargir la recherche.</div>';
}
["q","cat","dep","max","sort"].forEach(id=>$(id).addEventListener("input",render));
$("grid").addEventListener("click",e=>{const b=e.target.closest(".card");if(b)openDetail(+b.dataset.id)});

function openDetail(id){
  const a=ads.find(x=>x.id===id);if(!a)return;
  $("detailBody").innerHTML=`<div class="ph" style="${a.photo?`background-image:url('${a.photo}')`:''}">${a.photo?"":a.cat}</div>
  <h2>${esc(a.title)}</h2><div class="price">${eur(a.price)}</div>
  <div class="meta">${CATS[a.cat]} · ${esc(a.etat||"")} · ${esc(a.city)} (${DEPS[a.dep]}) · ${ago(a.ts)}</div>
  <p>${esc(a.desc)}</p>
  <div id="tel"><button class="btn" id="showTel">Voir le numéro</button></div>
  <p class="note">Demandez des photos détaillées et vérifiez l’authenticité avant d’acheter. Rencontre en main propre, dans un lieu public, sans livraison. Ne payez jamais à l’avance.</p>
  <div class="row"><button class="btn alt" id="boost">Remonter en tête</button><button class="btn alt" id="del">Supprimer</button><button class="btn alt" id="close">Fermer</button></div>`;
  $("showTel").onclick=()=>{$("tel").innerHTML=`<a class="tel" href="tel:${esc(a.tel.replace(/[^0-9+]/g,''))}">${esc(a.tel)}</a>`};
  $("boost").onclick=()=>{a.ts=Date.now();a.boost=true;save();render();$("detail").close()};
  $("del").onclick=()=>{if(confirm("Supprimer cette annonce ?")){ads=ads.filter(x=>x.id!==id);save();render();$("detail").close()}};
  $("close").onclick=()=>$("detail").close();
  $("detail").showModal();
}
$("newBtn").onclick=()=>$("post").showModal();
$("cancel").onclick=()=>$("post").close();

function resize(file){return new Promise(res=>{if(!file)return res("");const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,640/i.width),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.7))};i.onerror=()=>res("");i.src=r.result};r.onerror=()=>res("");r.readAsDataURL(file)})}
$("form").addEventListener("submit",async e=>{
  e.preventDefault();
  const f=new FormData(e.target),photo=await resize($("photo").files[0]);
  ads.unshift({id:Date.now(),title:f.get("title").trim(),price:+f.get("price"),cat:f.get("cat"),dep:+f.get("dep"),city:f.get("city").trim(),desc:f.get("desc").trim(),tel:f.get("tel").trim(),etat:f.get("etat"),photo,ts:Date.now()});
  save();render();e.target.reset();$("post").close();
});
render();
</script>
</body>
</html>
